---
# ==============================================================================
# Docker Torrent Stack (Privacy Gateway & BitTorrent Downloader)
# Adheres to Homelab Systems Lifecycle (HSL) and ADR 0035 Standards
# ==============================================================================

services:
  gluetun:
    image: qmcgaw/gluetun:v3.39.1
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # HTTP Proxy for external indexer search routing (*arr suite)
      - "${GLUETUN_HTTP_PROXY_PORT:-8888}:8888/tcp"
      # Transmission Web UI forward
      - "${TRANSMISSION_WEB_PORT:-9091}:9091/tcp"
      # BitTorrent incoming peer port forwarded through VPN
      - "${VPN_FORWARDED_PORT:-8999}:${VPN_FORWARDED_PORT:-8999}/tcp"
      - "${VPN_FORWARDED_PORT:-8999}:${VPN_FORWARDED_PORT:-8999}/udp"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-mullvad}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - FIREWALL_VPN_INPUT_PORTS=${VPN_FORWARDED_PORT:-8999}
      - HTTPPROXY=${HTTPPROXY:-on}
      - DOT=off
      - TZ=${TZ:-America/Detroit}
    volumes:
      - ${DATA_DIR:-./data}/gluetun:/gluetun

  transmission:
    image: lscr.io/linuxserver/transmission:4.0.6
    container_name: transmission
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_started
    environment:
      - PUID=${PUID:-999}
      - PGID=${PGID:-110}
      - TZ=${TZ:-America/Detroit}
      - USER=${TRANSMISSION_USER:-gemini}
      - PASS=${TRANSMISSION_PASS:-rtt234egs}
      - TR_DOWNLOAD_DIR=/media/downloads/complete
      - TR_INCOMPLETE_DIR=/media/downloads/incomplete
      - UMASK=${UMASK:-002}
    volumes:
      - ${DATA_DIR:-./data}/transmission:/config
      - ${MEDIA_DIR:-/mnt/nas/media}:/media
